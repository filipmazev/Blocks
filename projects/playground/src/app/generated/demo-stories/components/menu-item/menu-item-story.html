<ng-template #startIcon>
    <img src="blocks-app-icon.svg" width="20" height="20" alt="" />
</ng-template>
<ng-template #endIcon>
    <span aria-hidden="true">Pro</span>
</ng-template>
<bx-menu-item
    [icon]="args().icon"
    [endIcon]="args().endIcon"
    [label]="args().label"
    [ariaLabel]="args().ariaLabel"
    [wrapLabel]="args().wrapLabel"
    [tooltipOnTruncate]="args().tooltipOnTruncate"
    [disabled]="args().disabled"
    [loading]="args().loading"
    [danger]="args().danger"
    [shortcut]="args().shortcut"
    [iconTemplate]="args().useIconTemplate ? startIcon : undefined"
    [endIconTemplate]="args().useEndIconTemplate ? endIcon : undefined"
    (action)="onAction('action', $event)" />
