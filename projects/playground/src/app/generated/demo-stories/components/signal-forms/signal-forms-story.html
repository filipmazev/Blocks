<form class="signal-form-scene">
    <bx-input-field
        [type]="args().type"
        [step]="args().step"
        [autocomplete]="args().autocomplete"
        [inputmode]="args().inputmode"
        [spellcheck]="args().spellcheck"
        [multiline]="args().multiline"
        [rows]="args().rows"
        [autosize]="args().autosize"
        [minRows]="args().minRows"
        [maxRows]="args().maxRows"
        [decreaseLabel]="args().decreaseLabel"
        [increaseLabel]="args().increaseLabel"
        [id]="args().id"
        [label]="args().label"
        [placeholder]="args().placeholder"
        [tooltip]="args().tooltip"
        [hint]="args().hint"
        [hintEnd]="args().hintEnd"
        [error]="args().error"
        [ariaLabel]="args().ariaLabel"
        [ariaLabelledBy]="args().ariaLabelledBy"
        [ariaDescribedBy]="args().ariaDescribedBy"
        [dataTestId]="args().dataTestId"
        [readOnly]="args().readOnly"
        [loading]="args().loading"
        [submitted]="args().submitted"
        [errorPolicy]="args().errorPolicy"
        [errorMode]="args().errorMode"
        [appearance]="args().appearance"
        [floatLabel]="args().floatLabel"
        [hideRequiredMarker]="args().hideRequiredMarker"
        [subscriptSizing]="args().subscriptSizing"
        [tooltipOnTruncate]="args().tooltipOnTruncate"
        [formField]="projectForm.project"
        (touch)="onAction('touch', $event)"
        (valueChange)="onAction('valueChange', $event)" />
    <bx-input-field label="Email" type="email" [formField]="projectForm.email" />
    <bx-input-field label="Project notes" [multiline]="true" [formField]="projectForm.notes" />
    <bx-tag [text]="projectForm().valid() ? 'Ready to submit' : 'Needs attention'" />
    <button type="button" bx-button variant="filled" [disabled]="!projectForm().valid()" (click)="onAction('submit', formModel())">Save project</button>
</form>
