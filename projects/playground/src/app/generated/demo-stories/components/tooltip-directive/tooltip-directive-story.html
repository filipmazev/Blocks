<button
    type="button"
    bx-button
    [bxTooltip]="args().bxTooltip"
    [placement]="args().placement"
    [bxTooltipTouch]="args().bxTooltipTouch"
    [bxTooltipHover]="args().bxTooltipHover"
    [bxTooltipDwell]="args().bxTooltipDwell"
    [bxTooltipTruncatedOnly]="args().bxTooltipTruncatedOnly">
    {{ args().content }}
</button>
