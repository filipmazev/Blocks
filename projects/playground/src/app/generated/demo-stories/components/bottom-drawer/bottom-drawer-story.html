<div class="drawer-scene">
    <button type="button" bx-button variant="tonal" (click)="onAction('openChange', true)"><bx-icon name="panel-bottom-open" />Open drawer</button>
    <bx-bottom-drawer
        [open]="args().open"
        [animationDuration]="args().animationDuration"
        [modal]="args().modal"
        [embedded]="args().embedded"
        [dismissible]="args().dismissible"
        [autoClose]="args().autoClose"
        [closeOnBackdrop]="args().closeOnBackdrop"
        [showBackdrop]="args().showBackdrop"
        [showHandle]="args().showHandle"
        [swipeToDismiss]="args().swipeToDismiss"
        [showCloseButton]="args().showCloseButton"
        [stickyFooter]="args().stickyFooter"
        [autoFocus]="args().autoFocus"
        [busy]="args().busy"
        [disabled]="args().disabled"
        [size]="args().size"
        [maxHeight]="args().maxHeight"
        [title]="args().title"
        [subtitle]="args().subtitle"
        [icon]="args().icon"
        [ariaLabel]="args().ariaLabel"
        [closeLabel]="args().closeLabel"
        [headerVisible]="args().headerVisible"
        [panelClass]="args().panelClass"
        [panelStyle]="args().panelStyle"
        [surfaceId]="args().surfaceId"
        (closeRequest)="onAction('closeRequest', $event)"
        (closed)="onAction('closed', $event)"
        (closeCancelled)="onAction('closeCancelled', $event)"
        (openChange)="onAction('openChange', $event)"
        (offsetChange)="onAction('offsetChange', $event)">
        {{ args().content }}
    </bx-bottom-drawer>
</div>
