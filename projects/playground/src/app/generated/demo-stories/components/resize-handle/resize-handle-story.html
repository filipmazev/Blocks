<div #container class="resize-scene" style="position: relative; inline-size: 100%; min-block-size: 12rem">
    <div #surface class="resize-surface" style="position: relative; min-block-size: 12rem; max-inline-size: 100%" [style.inline-size.px]="args().resizeValue">
        {{ args().content }}
        <div
            class="demo-resize-grip"
            bxResizeHandle
            [resizeContainer]="container"
            [resizeTarget]="surface"
            [resizeValue]="args().resizeValue"
            [resizeEdge]="args().resizeEdge"
            [resizeMinSize]="args().resizeMinSize"
            [resizeMaxSize]="args().resizeMaxSize"
            [resizeInitialSize]="args().resizeInitialSize"
            [resizeDisableShrink]="args().resizeDisableShrink"
            [resizeDisabled]="args().resizeDisabled"
            [resizeLabel]="args().resizeLabel"
            [resizeControls]="args().resizeControls"
            [resizeStep]="args().resizeStep"
            [resizeIdleDelay]="args().resizeIdleDelay"
            (resizeStart)="onAction('resizeStart', $event)"
            (resizeEnd)="onAction('resizeEnd', $event)"
            (resizeValueChange)="onAction('resizeValueChange', $event)"></div>
    </div>
</div>
