<ng-template #pickerVisual>
    <img src="blocks-app-icon.svg" width="16" height="16" alt="" />
</ng-template>
<bx-date-picker
    [mode]="args().mode"
    [pickerIcon]="args().pickerIcon"
    [openPickerLabel]="args().openPickerLabel"
    [startAt]="args().startAt"
    [startView]="args().startView"
    [locale]="args().locale"
    [calendarId]="args().calendarId"
    [timeZone]="args().timeZone"
    [weekStartsOn]="args().weekStartsOn"
    [minimalDaysInFirstWeek]="args().minimalDaysInFirstWeek"
    [dateFormat]="args().dateFormat"
    [allowNaturalLanguage]="args().allowNaturalLanguage"
    [editable]="args().editable"
    [presentation]="args().presentation"
    [weekdayNameFormat]="args().weekdayNameFormat"
    [monthNameFormat]="args().monthNameFormat"
    [months]="args().months"
    [separateFields]="args().separateFields"
    [commitPolicy]="args().commitPolicy"
    [closeOnSelect]="args().closeOnSelect"
    [clearable]="args().clearable"
    [presetsPlacement]="args().presetsPlacement"
    [min]="args().min"
    [max]="args().max"
    [crossingPolicy]="args().crossingPolicy"
    [minRangeLength]="args().minRangeLength"
    [maxRangeLength]="args().maxRangeLength"
    [allowSameDay]="args().allowSameDay"
    [selectionLimit]="args().selectionLimit"
    [loadingLabel]="args().loadingLabel"
    [retryLabel]="args().retryLabel"
    [loadErrorMessage]="args().loadErrorMessage"
    [invalidSelectionLabel]="args().invalidSelectionLabel"
    [applyLabel]="args().applyLabel"
    [cancelLabel]="args().cancelLabel"
    [clearLabel]="args().clearLabel"
    [todayLabel]="args().todayLabel"
    [presetsLabel]="args().presetsLabel"
    [showToday]="args().showToday"
    [showTodayButton]="args().showTodayButton"
    [startLabel]="args().startLabel"
    [endLabel]="args().endLabel"
    [moreDatesLabel]="args().moreDatesLabel"
    [selectedDatesLabel]="args().selectedDatesLabel"
    [clearTooltip]="args().clearTooltip"
    [visibleTagCount]="args().visibleTagCount"
    [value]="args().value"
    [id]="args().id"
    [label]="args().label"
    [placeholder]="args().placeholder"
    [tooltip]="args().tooltip"
    [hint]="args().hint"
    [hintEnd]="args().hintEnd"
    [error]="args().error"
    [ariaLabel]="args().ariaLabel"
    [ariaLabelledBy]="args().ariaLabelledBy"
    [ariaDescribedBy]="args().ariaDescribedBy"
    [dataTestId]="args().dataTestId"
    [name]="args().name"
    [invalid]="args().invalid"
    [pending]="args().pending"
    [touched]="args().touched"
    [dirty]="args().dirty"
    [disabled]="args().disabled"
    [readonly]="args().readonly"
    [readOnly]="args().readOnly"
    [hidden]="args().hidden"
    [required]="args().required"
    [loading]="args().loading"
    [submitted]="args().submitted"
    [errorPolicy]="args().errorPolicy"
    [errorMode]="args().errorMode"
    [appearance]="args().appearance"
    [floatLabel]="args().floatLabel"
    [hideRequiredMarker]="args().hideRequiredMarker"
    [subscriptSizing]="args().subscriptSizing"
    [tooltipOnTruncate]="args().tooltipOnTruncate"
    [pickerIconTemplate]="args().usePickerIconTemplate ? pickerVisual : undefined"
    (viewChange)="onAction('viewChange', $event)"
    (monthSelected)="onAction('monthSelected', $event)"
    (yearSelected)="onAction('yearSelected', $event)"
    (valueCommit)="onAction('valueCommit', $event)"
    (draftChange)="onAction('draftChange', $event)"
    (openChange)="onAction('openChange', $event)"
    (visibleRangeChange)="onAction('visibleRangeChange', $event)"
    (request)="onAction('request', $event)"
    (retry)="onAction('retry', $event)"
    (parseFailed)="onAction('parseFailed', $event)"
    (touch)="onAction('touch', $event)"
    (valueChange)="onAction('valueChange', $event)" />
