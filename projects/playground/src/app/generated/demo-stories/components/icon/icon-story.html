<ng-template #customIcon>
    <img src="blocks-app-icon.svg" alt="" [width]="args().size" [height]="args().size" />
</ng-template>
<bx-icon
    [name]="args().name"
    [size]="args().size"
    [color]="args().color"
    [bgColor]="args().bgColor"
    [strokeWidth]="args().strokeWidth"
    [animated]="args().animated"
    [decorative]="args().decorative"
    [ariaLabel]="args().ariaLabel"
    [contentTemplate]="args().useIconTemplate ? customIcon : undefined" />
