<bx-form-field
    [inline]="args().inline"
    [label]="args().label"
    [tooltip]="args().tooltip"
    [tooltipLabel]="args().tooltipLabel"
    [error]="args().error"
    [hint]="args().hint"
    [hintEnd]="args().hintEnd"
    [required]="args().required"
    [hideRequiredMarker]="args().hideRequiredMarker"
    [loading]="args().loading"
    [showLoadingIndicator]="args().showLoadingIndicator"
    [forId]="args().forId"
    [subscriptSizing]="args().subscriptSizing">
    <input bxInput aria-label="Project name" />
</bx-form-field>
