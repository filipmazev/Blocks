<bx-multi-select
    [allSelectedTooltip]="args().allSelectedTooltip"
    [allSelectedText]="args().allSelectedText"
    [selectedCountText]="args().selectedCountText"
    [summaryThreshold]="args().summaryThreshold"
    [showSelectAll]="args().showSelectAll"
    [selectAllLabel]="args().selectAllLabel"
    [selectionScope]="args().selectionScope"
    [selectAll]="args().selectAll"
    [clearable]="args().clearable"
    [clearLabel]="args().clearLabel"
    [clearTooltip]="args().clearTooltip"
    [selectionDisplay]="args().selectionDisplay"
    [visibleTagCount]="args().visibleTagCount"
    [tagOverflowText]="args().tagOverflowText"
    [options]="args().options"
    [isSearchable]="args().isSearchable"
    [externalFiltering]="args().externalFiltering"
    [searchValue]="args().searchValue"
    [searchDebounce]="args().searchDebounce"
    [searchPlaceholder]="args().searchPlaceholder"
    [emptyMessage]="args().emptyMessage"
    [loadingLabel]="args().loadingLabel"
    [loadingAriaLabel]="args().loadingAriaLabel"
    [hasMore]="args().hasMore"
    [loadError]="args().loadError"
    [panelClass]="args().panelClass"
    [value]="args().value"
    [id]="args().id"
    [label]="args().label"
    [placeholder]="args().placeholder"
    [tooltip]="args().tooltip"
    [hint]="args().hint"
    [hintEnd]="args().hintEnd"
    [error]="args().error"
    [ariaLabel]="args().ariaLabel"
    [ariaLabelledBy]="args().ariaLabelledBy"
    [ariaDescribedBy]="args().ariaDescribedBy"
    [dataTestId]="args().dataTestId"
    [name]="args().name"
    [invalid]="args().invalid"
    [pending]="args().pending"
    [touched]="args().touched"
    [dirty]="args().dirty"
    [disabled]="args().disabled"
    [readonly]="args().readonly"
    [readOnly]="args().readOnly"
    [hidden]="args().hidden"
    [required]="args().required"
    [loading]="args().loading"
    [submitted]="args().submitted"
    [errorPolicy]="args().errorPolicy"
    [errorMode]="args().errorMode"
    [appearance]="args().appearance"
    [floatLabel]="args().floatLabel"
    [hideRequiredMarker]="args().hideRequiredMarker"
    [subscriptSizing]="args().subscriptSizing"
    [tooltipOnTruncate]="args().tooltipOnTruncate"
    (selectionChange)="onAction('selectionChange', $event)"
    (selectAllIntentChange)="onAction('selectAllIntentChange', $event)"
    (search)="onAction('search', $event)"
    (loadMore)="onAction('loadMore', $event)"
    (openedChange)="onAction('openedChange', $event)"
    (touch)="onAction('touch', $event)"
    (selectAllChange)="onAction('selectAllChange', $event)"
    (searchValueChange)="onAction('searchValueChange', $event)"
    (valueChange)="onAction('valueChange', $event)">
    {{ args().content }}
</bx-multi-select>
