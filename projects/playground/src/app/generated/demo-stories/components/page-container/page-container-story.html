<bx-page-container
    [size]="args().size"
    [sectionTitle]="args().sectionTitle"
    [pageTitle]="args().pageTitle"
    [pageDescription]="args().pageDescription"
    [autoResolveTitlesFromNavigation]="args().autoResolveTitlesFromNavigation"
    [showBreadcrumbs]="args().showBreadcrumbs"
    [breadcrumbsAfter]="args().breadcrumbsAfter"
    [breadcrumbLabel]="args().breadcrumbLabel"
    ><bx-page-content>{{ args().content }}</bx-page-content
    ><bx-page-footer>Project actions</bx-page-footer></bx-page-container
>
