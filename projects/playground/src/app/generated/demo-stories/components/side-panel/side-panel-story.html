<bx-side-panel-layout style="block-size: 26rem">
    <bx-side-panel
        [open]="args().open"
        [placement]="args().placement"
        [width]="args().width"
        [resizable]="args().resizable"
        [resizeMinWidth]="args().resizeMinWidth"
        [resizeMaxWidth]="args().resizeMaxWidth"
        [resizeDisableShrink]="args().resizeDisableShrink"
        [resizeLabel]="args().resizeLabel"
        [resizeIdleDelay]="args().resizeIdleDelay"
        [layoutMode]="args().layoutMode"
        [backdrop]="args().backdrop"
        [closeOnBackdrop]="args().closeOnBackdrop"
        [closeOnEscape]="args().closeOnEscape"
        [showCloseButton]="args().showCloseButton"
        [ariaLabel]="args().ariaLabel"
        [closeLabel]="args().closeLabel"
        [labelledBy]="args().labelledBy"
        [autoFocus]="args().autoFocus"
        [restoreFocus]="args().restoreFocus"
        [animationDuration]="args().animationDuration"
        (openChange)="onAction('openChange', $event)"
        (widthChange)="onAction('widthChange', $event)">
        {{ args().content }}
    </bx-side-panel>
    <div class="panel-scene-content">
        <button type="button" bx-button variant="tonal" (click)="onAction('openChange', true)"><bx-icon name="panel-right-open" />Open panel</button>
        <p>Project content remains available beside the panel.</p>
    </div>
</bx-side-panel-layout>
