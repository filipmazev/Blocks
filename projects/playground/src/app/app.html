<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-container">
    <app-sidenav #navigation title="Blocks" />
    <div class="app-main">
        <bx-top-nav class="app-toolbar" data-bx-light-scope [config]="toolbarConfig" [groups]="toolbarGroups">
            <ng-template bxTopNavBrand>
                @if (navigation.mobile()) {
                    <button
                        bx-button
                        type="button"
                        variant="tonal"
                        color="grayscale"
                        class="navigation-toggle"
                        aria-label="Open navigation"
                        [class.is-open]="navigation.open()"
                        [attr.aria-expanded]="navigation.open()"
                        [attr.aria-controls]="navigation.panelId()"
                        [attr.aria-hidden]="navigation.open() ? true : null"
                        [attr.inert]="navigation.open() ? '' : null"
                        (click)="navigation.toggle($event)">
                        <bx-icon name="menu" size="16" />
                    </button>
                }
                <span class="toolbar-label">Component playground</span>
            </ng-template>
            <ng-template bxTopNavActions>
                <div class="toolbar-actions">
                    <a
                        bx-button
                        class="appearance-button"
                        variant="tonal"
                        color="grayscale"
                        routerLink="/appearance"
                        aria-label="Configure appearance for the whole playground"
                        ><bx-icon name="sliders-horizontal" size="20" /><span>Appearance</span></a
                    >
                </div>
            </ng-template>
        </bx-top-nav>
        <main class="app-content-container" id="main-content" tabindex="-1"><router-outlet /></main>
    </div>
</div>
