<div class="story-actions">
    <button type="button" bx-button variant="filled" (click)="openModal()"><bx-icon name="app-window" size="16" />Open modal</button>
    <button type="button" bx-button variant="tonal" [disabled]="!activeModal()" (click)="patchOpenModal()">
        <bx-icon name="check" size="16" />Apply changes
    </button>
    <button type="button" bx-button variant="tonal" [disabled]="!activeModal()" (click)="closeModal()"><bx-icon name="x" size="16" />Close modal</button>
</div>
<p>Controls configure the next opening. Apply changes updates the current dialog. Layout, animation and responsive layouts apply when opening.</p>
<p>The dialog preserves nested modals, menus, projected header/footer content, translated close actions, live patches and the asynchronous wizard.</p>
