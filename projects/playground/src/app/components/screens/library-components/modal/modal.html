<div class="demo-container">
    <app-component-info [codeFiles]="codeFiles" [readmePath]="modalReadmePath()"></app-component-info>

    <div class="config-container">
        <div class="config-header">Demo</div>

        <form [formGroup]="form" class="config-form form-section">

            <div class="form-section">
                <h3>General Style</h3>

                <bx-select label="Default Layout" formControlName="layout" [options]="layoutSelectOptions">
                </bx-select>

                <bx-input-field label="Header Text" formControlName="headerText"></bx-input-field>

                <bx-input-field label="Title" formControlName="title"></bx-input-field>

            </div>

            <div class="form-section">
                <h3>Behavior & Toggles</h3>

                <div class="form-checkboxes">
                    <bx-checkbox label="Animate" formControlName="animate"></bx-checkbox>

                    <bx-checkbox label="Has Backdrop" formControlName="hasBackdrop"></bx-checkbox>

                    <bx-checkbox label="Show Close Button" formControlName="showCloseButton"></bx-checkbox>

                    <bx-checkbox label="Disable Close (Global)" formControlName="disableClose"
                        tooltip="Prevents closing via ESC key or backdrop clicks.">
                    </bx-checkbox>

                    <bx-checkbox label="Disable Backdrop Click"
                        formControlName="disableCloseOnBackdropClick"></bx-checkbox>

                    <bx-checkbox label="Use Confirm Close Guard" formControlName="hasConfirmCloseGuard"
                        tooltip="Intercepts the close event and prompts the user to confirm.">
                    </bx-checkbox>
                </div>
            </div>

            <div class="form-section">
                <h3>Responsive Breakpoints</h3>
                <p class="hint">Select 'none' to ignore that breakpoint.</p>

                <div class="breakpoints-grid">
                    @for(breakpoint of breakpointKeys; track breakpoint) {
                    <bx-select [label]="breakpoint" [formControlName]="breakpoint" [options]="breakpointSelectOptions">
                    </bx-select>
                    }
                </div>
            </div>

        </form>

        <div class="actions">
            <button bx-button (click)="openModal()" [disabled]="form.invalid" variant="filled" color="grayscale">
                Open Modal
            </button>
        </div>
    </div>
</div>
