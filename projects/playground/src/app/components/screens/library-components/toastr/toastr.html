<header class="page-heading"><p class="eyebrow">Overlay components</p><h1>Notifications</h1><p>Preview toast placement, behavior, and shared application appearance.</p></header>
<div class="demo-container">
    <app-component-info [matchHeight]="configPanel" [codeFiles]="codeFiles" [readmePath]="toastrReadmePath()"></app-component-info>

    <div #configPanel class="config-container" bxSurface>
        <div class="config-header">Configurator</div>
        <p class="hint">Uses your shared appearance. <a routerLink="/appearance">Adjust appearance settings</a></p>
        <p class="hint" role="status">{{ resultMessage() }}</p>

        <form [formGroup]="form" class="config-form">

            <div class="form-section">
                <h3>General Style & Data</h3>

                <bx-select [clearable]="false" label="Position" [errorMessages]="{ required: 'Choose a position.' }" formControlName="position" [options]="positionSelectOptions" subscriptSizing="dynamic">
                </bx-select>

                <bx-input-field label="Title for demo toast" formControlName="title" subscriptSizing="dynamic">
                </bx-input-field>

                <bx-input-field label="Message for demo toast" formControlName="message" subscriptSizing="dynamic">
                </bx-input-field>
            </div>

            <div class="form-section">
                <h3>Behavior & Toggles</h3>

                <bx-input-field label="Duration (ms)" [errorMessages]="{ min: 'Duration must be zero or greater.' }" formControlName="durationInMs" type="number"
                    tooltip="Set to 0 to disable auto-close" subscriptSizing="dynamic">
                </bx-input-field>

                <bx-input-field label="Max Opened (Queue Limit)" [errorMessages]="{ min: 'Show at least one notification.', max: 'Show at most ten notifications.' }" formControlName="maxOpened" type="number" subscriptSizing="dynamic">
                </bx-input-field>

                <div class="form-checkboxes">
                    <bx-checkbox label="Animate" formControlName="animate" subscriptSizing="dynamic">
                    </bx-checkbox>

                    <bx-checkbox label="Swipe to Dismiss" formControlName="swipeToDismiss" subscriptSizing="dynamic">
                    </bx-checkbox>
                </div>
            </div>

        </form>

        <div class="actions">
            <button bx-button (click)="queueToast()" variant="filled" color="grayscale" [disabled]="form.invalid">
                Demo Toast
            </button>
        </div>

        <div class="buttons-container">
            <button bx-button (click)="queueSimpleToast('info')" variant="filled" [outlined]="true" color="info"
                [disabled]="form.invalid">Info</button>
            <button bx-button (click)="queueSimpleToast('success')" variant="filled" [outlined]="true" color="success"
                [disabled]="form.invalid">Success</button>
            <button bx-button (click)="queueSimpleToast('warn')" variant="filled" [outlined]="true" color="warn"
                [disabled]="form.invalid">Warn</button>
            <button bx-button (click)="queueSimpleToast('danger')" variant="filled" [outlined]="true" color="danger"
                [disabled]="form.invalid">Error</button>
        </div>
    </div>
</div>
