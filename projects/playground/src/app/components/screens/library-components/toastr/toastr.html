<div class="demo-container">
    <app-component-info [codeFiles]="codeFiles" [readmePath]="toastrReadmePath()"></app-component-info>

    <div class="config-container">
        <div class="config-header">Demo</div>

        <form [formGroup]="form" class="config-form">

            <div class="form-section">
                <h3>General Style & Data</h3>

                <bx-select label="Position" formControlName="position" [options]="positionSelectOptions">
                </bx-select>

                <bx-input-field label="Title for demo toast" formControlName="title">
                </bx-input-field>

                <bx-input-field label="Message for demo toast" formControlName="message">
                </bx-input-field>
            </div>

            <div class="form-section">
                <h3>Behavior & Toggles</h3>

                <bx-input-field label="Duration (ms)" formControlName="durationInMs" type="number"
                    tooltip="Set to 0 to disable auto-close">
                </bx-input-field>

                <bx-input-field label="Max Opened (Queue Limit)" formControlName="maxOpened" type="number">
                </bx-input-field>

                <div class="form-checkboxes">
                    <bx-checkbox label="Animate" formControlName="animate">
                    </bx-checkbox>

                    <bx-checkbox label="Swipe to Dismiss" formControlName="swipeToDismiss">
                    </bx-checkbox>
                </div>
            </div>

        </form>

        <div class="actions">
            <button bx-button (click)="queueToast()" variant="filled" color="grayscale" [disabled]="form.invalid">
                Demo Toast
            </button>
        </div>

        <div class="buttons-container">
            <button bx-button (click)="queueSimpleToast('info')" variant="filled" [outlined]="true" color="info"
                [disabled]="form.invalid">Info</button>
            <button bx-button (click)="queueSimpleToast('success')" variant="filled" [outlined]="true" color="success"
                [disabled]="form.invalid">Success</button>
            <button bx-button (click)="queueSimpleToast('warn')" variant="filled" [outlined]="true" color="warn"
                [disabled]="form.invalid">Warn</button>
            <button bx-button (click)="queueSimpleToast('danger')" variant="filled" [outlined]="true" color="danger"
                [disabled]="form.invalid">Error</button>
        </div>
    </div>
</div>
