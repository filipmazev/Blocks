<div class="mini-window">
  <div class="mini-toolbar">
    <bx-icon name="layers" size="16" /><span>Blocks</span><span class="mini-toolbar-dot"></span>
  </div>
  <div class="mini-workspace">
    <div class="mini-sidebar"><span class="mini-nav-active"></span><span></span><span></span></div>
    <bx-card title="Workspace" [headingLevel]="4" [opaque]="true">
      <div class="mini-card-row">
        <span class="mini-avatar"><bx-icon name="check" size="16" /></span
        ><span>Design system</span>
      </div>
      <bx-progress-bar [value]="68" label="Project progress" />
      <div class="mini-card-footer">
        <span>12 components</span
        ><bx-tag
          text="Ready"
          size="small"
          color="accent"
          [opaque]="true"
          [tooltipOnTruncate]="false"
        />
      </div>
    </bx-card>
  </div>
</div>
