<p>Import a Studio JSON document or SCSS generated by Blocks Theme Studio. Import replaces the draft in both modes; Undo restores it.</p>
<div class="file-choice">
    <button bx-button type="button" variant="tonal" (click)="themeFile.click()"><bx-icon name="upload" size="16" />Choose theme file</button
    ><span>{{ fileName() }}</span>
</div>
<input #themeFile id="studio-import-file" type="file" hidden accept=".json,.scss,application/json,text/plain" (change)="readFile($event)" />
<bx-input-field
    label="Theme JSON or exported SCSS"
    errorPolicy="always"
    subscriptSizing="dynamic"
    [multiline]="true"
    [spellcheck]="false"
    [rows]="5"
    [minRows]="4"
    [maxRows]="8"
    [value]="source()"
    [error]="error()"
    [invalid]="!!error()"
    (valueChange)="sourceChanged($event)" />
<div *appModalFooter class="import-footer">
    <p class="import-status" role="status">{{ loading() ? 'Reading theme file…' : error() }}</p>
    <div class="import-actions">
        <button bx-button type="button" variant="tonal" color="grayscale" (click)="close()">Cancel</button
        ><button bx-button type="button" variant="tonal" [disabled]="loading() || !source().trim() || !!error()" (click)="importTheme()">
            <bx-icon name="upload" size="16" />Import theme
        </button>
    </div>
</div>
