<bx-tabs class="code-viewer" variant="underline" ariaLabel="Code files">
    @for (file of files(); track file.path) {
    <bx-tab [label]="file.title" [value]="file.path">
        <ng-template bxTabContent>
            <pre><code [highlight]="codeContent(file)" [language]="file.language"></code></pre>
        </ng-template>
    </bx-tab>
    }
</bx-tabs>
