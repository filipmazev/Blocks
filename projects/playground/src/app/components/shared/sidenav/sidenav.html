@if (isHamburgerMenu()) {
    <header bxSurface [bxSurfaceInteractive]="false" class="mobile-header">
        <a class="brand" routerLink="/home" (click)="closeMobileMenu()">
            <app-blocks-logo class="brand-logo" />
            <span>{{ title() }}</span>
        </a>
        <button
            #menuToggle
            class="menu-toggle"
            [class.is-open]="isHamburgerMenuOpen()"
            type="button"
            aria-controls="component-navigation"
            [attr.aria-expanded]="isHamburgerMenuOpen()"
            [attr.aria-label]="isHamburgerMenuOpen() ? 'Close navigation' : 'Open navigation'"
            (click)="toggleMobileMenu()"
        >
            <span class="hamburger-icon" aria-hidden="true">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </span>
        </button>
    </header>
    <button
        class="navigation-scrim"
        [class.navigation-scrim-open]="isHamburgerMenuOpen()"
        type="button"
        aria-label="Close navigation"
        [attr.aria-hidden]="isHamburgerMenuOpen() ? null : 'true'"
        [attr.inert]="isHamburgerMenuOpen() ? null : ''"
        tabindex="-1"
        (click)="closeMobileMenu()"
    ></button>
}

<aside
    bxSurface
    [bxSurfaceInteractive]="false"
    [cdkTrapFocus]="isHamburgerMenu() && isHamburgerMenuOpen()"
    [cdkTrapFocusAutoCapture]="isHamburgerMenu() && isHamburgerMenuOpen()"
    id="component-navigation"
    class="sidebar"
    [class.mobile-sidebar]="isHamburgerMenu()"
    [class.mobile-sidebar-open]="!isHamburgerMenu() || isHamburgerMenuOpen()"
    [attr.aria-hidden]="isHamburgerMenu() && !isHamburgerMenuOpen() ? 'true' : null"
    [attr.inert]="isHamburgerMenu() && !isHamburgerMenuOpen() ? '' : null"
    tabindex="-1"
    (keydown.escape)="closeMobileMenu()"
>
    @if (!isHamburgerMenu()) {
        <div class="sidebar-header">
            <a class="brand" routerLink="/home">
                <app-blocks-logo class="brand-logo" />
                <span>{{ title() }}</span>
            </a>
            <span>Component library</span>
        </div>
    }
    <bx-search-input class="navigation-search" ariaLabel="Search pages" placeholder="Search pages..." [ngModel]="query()" (ngModelChange)="query.set($event)" />
    <div class="sidebar-scroll">
        <nav aria-label="Component documentation">
            @for (group of groups(); track group.id) {
                <section class="navigation-group" [attr.aria-label]="group.title">
                    <h2>{{ group.title }}</h2>
                    @for (item of group.items; track item.route) {
                        <a
                            [routerLink]="item.route"
                            routerLinkActive="active"
                            ariaCurrentWhenActive="page"
                            [routerLinkActiveOptions]="{ exact: true }"
                            (click)="closeMobileMenu()"
                        >
                            {{ item.label }}
                        </a>
                    }
                </section>
            } @empty { <p class="empty-navigation">No matching pages.</p> }
        </nav>
    </div>
</aside>
