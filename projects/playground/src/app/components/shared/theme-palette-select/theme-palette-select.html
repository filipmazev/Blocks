<bx-select
    label="Theme"
    subscriptSizing="dynamic"
    [options]="options"
    [value]="value()"
    [clearable]="false"
    [optionTemplate]="paletteOption"
    [triggerTemplate]="paletteTrigger"
    (valueChange)="change($event)" />
<ng-template #paletteOption let-option
    ><span class="palette-choice"
        ><span class="palette-swatches" aria-hidden="true">
            @for (color of colors(option.value); track $index) {
                <span [style.background-color]="color"></span>
            }</span
        >{{ option.label }}</span
    ></ng-template
>
<ng-template #paletteTrigger let-value let-labels="labels"
    ><span class="palette-choice"
        ><span class="palette-swatches" aria-hidden="true">
            @for (color of colors(value); track $index) {
                <span [style.background-color]="color"></span>
            }</span
        >{{ labels.join(', ') }}</span
    ></ng-template
>
