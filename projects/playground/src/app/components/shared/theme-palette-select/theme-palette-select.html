<bx-select
    #paletteSelect
    label="Theme"
    subscriptSizing="dynamic"
    panelWidth="26rem"
    [clearable]="false"
    [options]="options()"
    [value]="selectedValue()"
    [optionStartTemplate]="swatches"
    (selectionChange)="select($event.value, paletteSelect)">
    <span bxIconStart class="palette-swatches" aria-hidden="true">
        @for (color of colors(selectedValue(), true); track $index) {
            <span [style.background-color]="color"></span>
        }
    </span>
</bx-select>
<ng-template #swatches let-option>
    <span class="palette-swatches" aria-hidden="true">
        @for (color of colors(option.value); track $index) {
            <span [style.background-color]="color"></span>
        }
    </span>
</ng-template>
