            <div class="mini-nav"><strong>Portfolio</strong><span>Work · About</span></div>

                <h3>Design<br />&amp; code.</h3>
                <svg class="portfolio-wave" viewBox="0 0 3840 2160" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                        <linearGradient id="home-portfolio-wave" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop class="wave-start" offset="0%" />
                            <stop class="wave-end" offset="100%" />

                    </defs>
                    <path
                        fill="url(#home-portfolio-wave)"
                        d="M3070 756.5C2409 1027.04 2679.5 1794 1548 1536.46C612.118 1323.45 568.5 1189 0 1536.46V2160H3840V0C3840 0 3704.5 496.811 3070 756.5Z" />

    <bx-card bxSurface bxSurfaceGlassiness="auto" class="mini-site project-site" [bxSurfaceInteractive]="true" [surfaceEffects]="false">

            <div class="mini-nav"><strong>Selected work</strong><span>Web design</span></div>
            <div class="mini-intro">
                <h3>Portfolio page</h3>
            </div>
            <div class="project-art">

                <span class="art-orbit"></span>
                <span class="art-plane"></span>
                <strong class="art-title">Form<br />&amp; color</strong>

        </div>
    </bx-card>
    <bx-card bxSurface bxSurfaceGlassiness="auto" class="glass-sample" variant="elevated" [bxSurfaceInteractive]="true" [surfaceEffects]="false">

            <div class="glass-heading">
                <bx-icon name="blocks" size="24" />

            </div>
            <div class="glass-caption"><span>Shared themes</span><span>Accessible components</span></div>
            <div class="glass-spectrum"><span></span><span></span><span></span></div>
        </div>
