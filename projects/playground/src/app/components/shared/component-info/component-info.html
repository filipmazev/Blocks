<div class="info-container">
    <bx-tabs class="info-tabs" ariaLabel="Documentation and code examples">
        <bx-tab label="Documentation" value="documentation" icon="file-braces">
            <ng-template bxTabContent><app-readme [path]="readmePath()" /></ng-template>
        </bx-tab>
        <bx-tab label="Code Examples" value="code" icon="braces" color="accent">
            <ng-template bxTabContent><app-code [files]="codeFiles()" /></ng-template>
        </bx-tab>
    </bx-tabs>
</div>
