<div #animatorWrapper class="toast-animator" [class.collapsing]="isCollapsing()" [class.is-bottom]="isBottom()">
    <div #toastSwipeTarget bxSurface class="toast-wrapper" [ngClass]="wrapperClasses()" [class.show]="isVisible()"
        [class.no-animate]="!isAnimated()" [style.transform]="toastrTransform()" [style.--bx-toast-bg]="simpleToastSurface()" [style.--bx-toast-emission]="emissionColor()" [class.has-emission]="!!emissionColor()">
        @if(showCloseButton()) {
        <button type="button" class="toast-close-button" (click)="closeToast()" aria-label="Close toast">
            <bx-icon name="x" size="20" [color]="closeButtonColor()" />
        </button>
        }

        <ng-container #dynamicContainer></ng-container>

        @if (config?.durationInMs && showProgressBar() && progressBarCssVar() && progressBarBgCssVar()) {
        <div class="toast-progress-container" [style.background]="progressBarBgCssVar()">
            <div class="toast-progress-bar" [style.background]="progressBarCssVar()" #progressBar></div>
        </div>
        }
    </div>
</div>
