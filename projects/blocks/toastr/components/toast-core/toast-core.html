<div #animatorWrapper class="toast-animator" [class.collapsing]="isCollapsing()" [class.is-bottom]="isBottom()">
    <div
        #toastSwipeTarget
        bxSurface
        class="toast-wrapper"
        [bxSurfaceGlassiness]="config().hasDefaultBackground === false ? 'off' : (config().glassiness ?? 'auto')"
        [bxSurfaceQuality]="config().glassQuality ?? 'enhanced'"
        [ngClass]="wrapperClasses()"
        [class.show]="isVisible()"
        [class.no-animate]="!isAnimated()"
        [style.transform]="toastrTransform()"
        [style.--bx-toast-bg]="simpleToastSurface()"
        [style.--bx-toast-emission]="emissionColor()"
        [class.has-emission]="!!emissionColor()">
        @if (showCloseButton()) {
            <button type="button" class="toast-close-button" aria-label="Close toast" (click)="closeToast()">
                <bx-icon name="x" size="20" [color]="closeButtonColor()" />
            </button>
        }

        <ng-container #dynamicContainer></ng-container>

        @if (config().durationInMs && showProgressBar() && progressBarCssVar() && progressBarBgCssVar()) {
            <div class="toast-progress-container" [style.background]="progressBarBgCssVar()">
                <div #progressBar class="toast-progress-bar" [style.background]="progressBarCssVar()"></div>
            </div>
        }
    </div>
</div>
