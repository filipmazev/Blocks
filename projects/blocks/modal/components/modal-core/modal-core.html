@if (config().style.hasBackdrop && (isSide() || isBottomSheetModalActive())) {
    <bx-modal-backdrop [isAnimated]="isAnimated()" [isOpen]="isOpen()" (click)="onBackdropClick($event)"> </bx-modal-backdrop>
}

<ng-container #modalContainer>
    @switch (true) {
        @case (isSide()) {
            <bx-modal-side
                [layout]="effectiveLayout()"
                [headerTemplate]="headerTemplate()"
                [footerTemplate]="footerTemplate()"
                [config]="config()"
                [id]="id()"
                [isOpen]="isOpen()"
                [isAnimated]="isAnimated()"
                [isBottomSheetModalActive]="isBottomSheetModalActive()"
                [animationDuration]="animationDuration"
                [hasDefaultContentWrapperClass]="hasDefaultContentWrapperClass()"
                [hasBanner]="hasBanner()"
                (close)="close($event, undefined, true)">
                <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
            </bx-modal-side>
        }
        @case (isCentered()) {
            <bx-modal-centered
                [headerTemplate]="headerTemplate()"
                [footerTemplate]="footerTemplate()"
                [config]="config()"
                [id]="id()"
                [isOpen]="isOpen()"
                [isAnimated]="isAnimated()"
                [isBottomSheetModalActive]="isBottomSheetModalActive()"
                [animationDuration]="animationDuration"
                [hasDefaultContentWrapperClass]="hasDefaultContentWrapperClass()"
                [hasBanner]="hasBanner()"
                (close)="close($event, undefined, true)"
                (onBackdropClick)="onBackdropClick($event)">
                <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
            </bx-modal-centered>
        }
    }
</ng-container>

<ng-template #contentTemplate>
    <div class="modal-content" [ngClass]="config().contentClasses" [style]="config().contentStyles">
        <ng-container #dynamicContainer></ng-container>
    </div>
</ng-template>
