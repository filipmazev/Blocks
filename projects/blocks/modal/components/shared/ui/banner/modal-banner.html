<div class="modal-top-banner-container">
    @let headerData = header();
    @if (headerData) {
        <div class="modal-top-banner-title-container">
            @if (headerData.icon || headerData.loading !== undefined) {
                <span class="modal-icon-area" [style.min-inline-size.px]="iconSize()" [style.min-block-size.px]="iconSize()">
                    <bx-visual-transition [value]="headerData.loading ? 'loading' : headerData.icon">
                        <ng-template let-visual>
                            @if (visual === 'loading') {
                                <bx-loading-spinner [size]="iconSize()" [label]="headerData.loadingLabel ?? 'Loading'" />
                            } @else if (visual) {
                                <bx-icon
                                    [name]="visual.name"
                                    [contentTemplate]="visual.template"
                                    [size]="iconSize()"
                                    [color]="visual.color"
                                    [bgColor]="visual.bgColor"
                                    [strokeWidth]="visual.strokeWidth" />
                            }
                        </ng-template>
                    </bx-visual-transition>
                </span>
            }
            <span aria-live="polite" aria-atomic="true" [id]="titleId()">{{ resolvedText() }}</span>
        </div>
    }

    @if (showCloseButton()) {
        <button type="button" class="bx-modal-close" [attr.aria-label]="resolvedCloseLabel()" (click)="close.emit('cancel')"><bx-icon name="x" /></button>
    }
</div>
