<div class="modal-top-banner-container">
    @let headerData = header();
    @if (headerData) {
        <div class="modal-top-banner-title-container">
            @if (headerData.icon || headerData.loading !== undefined) {
                <span class="modal-icon-area" [style.min-inline-size.px]="iconSize()" [style.min-block-size.px]="iconSize()">
                    @if (headerData.icon; as icon) {
                        <bx-icon
                            [name]="icon.name"
                            [size]="iconSize()"
                            [color]="icon.color"
                            [bgColor]="icon.bgColor"
                            [strokeWidth]="icon.strokeWidth"
                            [style.visibility]="headerData.loading ? 'hidden' : 'visible'" />
                    }
                    @if (headerData.loading) {
                        <bx-loading-spinner [size]="iconSize()" [label]="headerData.loadingLabel ?? 'Loading'" />
                    }
                </span>
            }
            <span aria-live="polite" aria-atomic="true">{{ resolvedText() }}</span>
        </div>
    }

    @if (showCloseButton()) {
        <button type="button" class="bx-modal-close" aria-label="Close dialog" (click)="close.emit('cancel')"><bx-icon name="x" /></button>
    }
</div>
