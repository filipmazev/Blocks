@if (!isBottomSheetModalActive()) {
    <div bxSurface data-bx-light-scope [ngClass]="modalClasses()" [id]="id() ?? ''" [style.--anim-duration.ms]="animationDuration()">
        <div
            class="side-modal-inner-content-container"
            [class]="config() && config()?.style?.wrapperClasses ? config()?.style?.wrapperClasses : ''"
            [style]="config() && config()?.style?.wrapperStyles ? config()?.style?.wrapperStyles : ''">
            @if (hasBanner()) {
                <bx-modal-banner
                    [header]="config()?.header"
                    [showCloseButton]="config()?.disableClose !== true && config()?.style?.showCloseButton !== false"
                    (close)="close.emit('cancel')"></bx-modal-banner>
            }
            @if (headerTemplate()) {
                <div class="side-modal-header">
                    <ng-container *ngTemplateOutlet="headerTemplate()"></ng-container>
                    @if (!hasBanner() && config()?.disableClose !== true && config()?.style?.showCloseButton !== false) {
                        <button type="button" class="bx-modal-close" aria-label="Close dialog" (click)="close.emit('cancel')">
                            <bx-icon name="x" />
                        </button>
                    }
                </div>
            }
            <div class="side-modal-main-content-container">
                <ng-container [ngTemplateOutlet]="contentTemplate"> </ng-container>
            </div>
        </div>

        @if (footerTemplate()) {
            <div class="side-modal-footer">
                <ng-container *ngTemplateOutlet="footerTemplate()"></ng-container>
            </div>
        }
    </div>
} @else {
    <bx-modal-bottom-sheet
        [headerTemplate]="headerTemplate()"
        [footerTemplate]="footerTemplate()"
        [config]="config()"
        [id]="id()"
        [isOpen]="isOpen()"
        [isAnimated]="isAnimated()"
        [hasBanner]="hasBanner()"
        [animationDuration]="animationDuration()"
        (close)="close.emit('cancel')">
        <ng-container [ngTemplateOutlet]="contentTemplate"> </ng-container>
    </bx-modal-bottom-sheet>
}

<ng-template #contentTemplate>
    <ng-content></ng-content>
</ng-template>
