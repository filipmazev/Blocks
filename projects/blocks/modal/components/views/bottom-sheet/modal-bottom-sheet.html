<bx-bottom-drawer
    [embedded]="true"
    [modal]="false"
    [autoClose]="false"
    [open]="isSheetOpen()"
    [dismissible]="isDismissible()"
    [showBackdrop]="false"
    [showCloseButton]="false"
    [showHandle]="true"
    [headerVisible]="false"
    [stickyFooter]="true"
    [maxHeight]="resolvedMaxHeight()"
    [animationDuration]="isAnimated() ? animationDuration() : 0"
    [surfaceId]="id() ?? ''"
    [panelClass]="config()?.style?.wrapperClasses ?? ''"
    [panelStyle]="sheetStyles()"
    [(offset)]="currentTranslateY"
    (closeRequest)="onCloseRequest()">
    <div class="bottom-sheet-modal-inner-content-container">
        <div class="bottom-sheet-modal-top-group">
            @if (hasBanner()) {
                <bx-modal-banner [header]="config()?.header" [showCloseButton]="false"></bx-modal-banner>
            }

            @if (headerTemplate()) {
                <div class="bottom-sheet-modal-header">
                    <ng-container *ngTemplateOutlet="headerTemplate()"></ng-container>
                </div>
            }

            <div class="bottom-sheet-modal-main-content-container">
                <ng-container [ngTemplateOutlet]="contentTemplate"></ng-container>
            </div>
        </div>
    </div>

    @if (footerTemplate()) {
        <div bxDrawerFooter class="bottom-sheet-modal-footer">
            <ng-container *ngTemplateOutlet="footerTemplate()"></ng-container>
        </div>
    }
</bx-bottom-drawer>

<ng-template #contentTemplate>
    <ng-content></ng-content>
</ng-template>
