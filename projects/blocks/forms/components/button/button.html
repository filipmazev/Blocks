<span class="bx-btn-content-wrapper" [class.has-icon]="hasProjectedIcon()" [class.is-text-loading]="loading() && !hasProjectedIcon()">
    @if (loading()) {
        <bx-loading-spinner [size]="spinnerSize()" [decorative]="true" />
    }
    <span class="bx-btn-label"><ng-content></ng-content></span>
</span>
