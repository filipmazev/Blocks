<div class="bx-field-wrapper" [class.is-invalid]="!!resolvedError() || !!projectedError()" [attr.data-bx-field-invalid]="!!resolvedError() || !!projectedError()">

    @if (resolvedLabel() || (tooltip() && !inline())) {
    <div class="bx-field-header">
        <label class="bx-field-label" [attr.for]="forId()">
            {{ resolvedLabel() }}
            @if (required()) { <span class="bx-field-required">*</span> }
        </label>

        @if (tooltip()) {
        <button type="button" class="bx-field-tooltip-trigger" [bxTooltip]="tooltip()!" bxTooltipTouch="tap" placement="top" aria-label="More information">
            <bx-icon name="help-circle" size="16"></bx-icon>
        </button>
        }

        @if (loading()) {
        <bx-icon name="loader" class="bx-spin" size="16"></bx-icon>
        }
    </div>
    }

    <div class="bx-field-control" [class.bx-field-control-inline]="inline()">
        <ng-content></ng-content>
        @if (inline() && tooltip()) {
        <button type="button" class="bx-field-tooltip-trigger" [bxTooltip]="tooltip()!" bxTooltipTouch="tap" placement="top" [attr.aria-label]="'More information'">
            <bx-icon name="help-circle" size="16"></bx-icon>
        </button>
        }
    </div>

    <div class="bx-field-error-projected">
        <ng-content select="bx-error"></ng-content>
    </div>

    @if (resolvedError()) {
    <div class="bx-field-error" [class.bx-animated]="isAnimated()">
        <bx-icon name="alert-circle" size="16"></bx-icon>
        <span #errorText class="bx-field-error-text">{{ resolvedError() }}</span>
    </div>
    }
</div>
