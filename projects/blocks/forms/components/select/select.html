<bx-form-field [inline]="true" [tooltip]="tooltip()" [error]="errorMessage" [loading]="loading()" [forId]="inputId()">

    <button type="button" role="combobox" aria-haspopup="listbox" cdkOverlayOrigin bxSurface #origin="cdkOverlayOrigin" class="bx-select-trigger"
        [class.is-invalid]="!!errorMessage" [class.is-open]="isOpen()" [class.is-floating]="isFloating()"
        [attr.id]="inputId()" [attr.data-testid]="dataTestId()" [attr.aria-label]="ariaLabel() || resolvedLabel()"
        [disabled]="isDisabled() || loading()" (click)="toggleOpen()" (keydown)="onTriggerKey($event)"
        [attr.aria-expanded]="isOpen()" [attr.aria-controls]="isPanelAttached() ? inputId() + '-options' : null">

        <div class="bx-select-container">
            @if (label()) {
            <span class="bx-floating-label">
                {{ resolvedLabel() }}
                @if (isFieldRequired()) { <span class="bx-field-required">*</span> }
            </span>
            }

            <span class="bx-select-value" [attr.title]="selectedOptionLabel() || resolvedPlaceholder()" [class.is-placeholder]="internalValue() === null">
                @if (internalValue() === null && isFloating()) {
                {{ resolvedPlaceholder() }}
                } @else {
                {{ selectedOptionLabel() }}
                }
            </span>
        </div>

        <bx-icon class="bx-select-caret" name="chevron-down" size="16"></bx-icon>
    </button>

    <ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="origin" [cdkConnectedOverlayOpen]="isPanelAttached()"
        [cdkConnectedOverlayPositions]="overlayPositions" [cdkConnectedOverlayHasBackdrop]="false"
        [cdkConnectedOverlayWidth]="origin.elementRef.nativeElement.offsetWidth"
        (overlayOutsideClick)="onOutsideClick($event)" (attach)="onPanelAttach()" (detach)="onPanelDetach()" (positionChange)="refreshPanel()">

        <div class="bx-select-panel" bxSurface role="listbox" tabindex="0" [attr.aria-label]="resolvedLabel()" [id]="inputId() + '-options'" (keydown)="onPanelKey($event)">

            @if (isSearchable()) {
            <div class="bx-select-search-container">
                <bx-search-input #searchInput [placeholder]="resolvedSearchPlaceholder()"
                    (search)="onSearchChange($event)" (keydown.enter)="$event.preventDefault()">
                </bx-search-input>
            </div>
            }

            <div class="bx-select-menu-container">
                @for (option of filteredOptions(); track option.value) {

                <bx-menu-item role="option" [attr.aria-selected]="internalValue() === option.value" [disabled]="option.disabled ?? false" [wrapLabel]="true" (action)="selectOption(option)">
                    <div class="bx-select-item-inner">
                        <div class="bx-select-check-placeholder">
                            @if (internalValue() === option.value) {
                            <bx-icon name="check" size="16"></bx-icon>
                            }
                        </div>
                        <span [title]="option.resolvedStr">{{ option.resolvedStr }}</span>
                    </div>
                </bx-menu-item>

                } @empty {
                <div class="bx-select-empty">
                    <span class="bx-empty-text">{{ resolvedEmptyMessage() }}</span>
                </div>
                }
            </div>

        </div>
    </ng-template>

</bx-form-field>
