<bx-container class="page-layout" [size]="size()">
    @if (resolvedBreadcrumbs().length) {
        <nav class="breadcrumbs" [attr.aria-label]="resolvedBreadcrumbLabel()">
            <ol>
                @for (crumb of resolvedBreadcrumbs(); track $index; let last = $last) {
                    <li>
                        @if (last) {
                            <span aria-current="page">{{ crumb.label }}</span>
                        } @else {
                            <a [routerLink]="crumb.route">{{ crumb.label }}</a>
                            <span class="breadcrumb-divider" aria-hidden="true">/</span>
                        }
                    </li>
                }
            </ol>
        </nav>
    }
    @if (!projectedHeader()) {
        <bx-page-header
            [sectionTitle]="sectionTitle()"
            [pageTitle]="pageTitle()"
            [pageDescription]="pageDescription()"
            [autoResolveTitlesFromNavigation]="autoResolveTitlesFromNavigation()" />
    }
    <ng-content select="bx-page-header" />
    <div class="page-content"><ng-content /></div>
    <ng-content select="bx-page-footer" />
</bx-container>
