<bx-container class="page-layout" [size]="size()">
    @if (resolvedBreadcrumbs().length) {
        <bx-breadcrumb-trail
            class="breadcrumbs"
            separator="/"
            [items]="resolvedBreadcrumbs()"
            [config]="breadcrumbConfig()"
            [ariaLabel]="resolvedBreadcrumbLabel()" />
    }
    @if (!projectedHeader()) {
        <bx-page-header
            [sectionTitle]="sectionTitle()"
            [pageTitle]="pageTitle()"
            [pageDescription]="pageDescription()"
            [autoResolveTitlesFromNavigation]="autoResolveTitlesFromNavigation()" />
    }
    <ng-content select="bx-page-header" />
    <div class="page-content"><ng-content /></div>
    <ng-content select="bx-page-footer" />
</bx-container>
