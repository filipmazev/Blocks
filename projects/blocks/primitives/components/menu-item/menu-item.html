<button
    bxSurface
    type="button"
    role="menuitem"
    class="bx-menu-item-btn"
    bxTooltipTouch="longpress"
    [bxSurfaceEmission]="false"
    [disabled]="disabled() || loading()"
    [attr.aria-label]="resolvedAriaLabel()"
    [attr.aria-busy]="loading() ? true : null"
    [class.is-disabled]="disabled() || loading()"
    [class.is-danger]="danger()"
    [attr.aria-keyshortcuts]="disabled() || loading() ? null : shortcutAria()"
    [class.bx-menu-item-animated]="isAnimated()"
    [bxTooltip]="resolvedLabel() ?? menuText.text().trim() | bxTruncatedText: menuText.truncated() : tooltipOnTruncate()"
    (click)="onClick($event)">
    <span bxSwipeContent class="bx-menu-item-visual">
        @if (loading()) {
            <bx-loading-spinner class="bx-menu-item-leading" aria-hidden="true" [size]="20" />
        } @else {
            <span class="bx-menu-item-leading"
                ><ng-content select="[bxIconStart]">
                    @if (icon() || iconTemplate()) {
                        <bx-icon size="20" [name]="icon()" [contentTemplate]="iconTemplate()" />
                    }</ng-content
            ></span>
        }

        <span #menuText="bxTruncate" class="bx-menu-item-content" [bxTruncate]="!wrapLabel()" [class.bx-menu-item-content-wrapped]="wrapLabel()">
            @if (resolvedLabel()) {
                {{ resolvedLabel() }}
            } @else {
                <ng-content></ng-content>
            }
        </span>

        @if (resolvedShortcut()) {
            <span class="bx-menu-item-shortcut" [attr.aria-hidden]="shortcutAria() ? true : null">
                @for (key of resolvedShortcut(); track $index) {
                    <kbd>{{ key }}</kbd>
                }
            </span>
        }

        <span class="bx-icon-pos-end"
            ><ng-content select="[bxIconEnd]">
                @if (endIcon() || endIconTemplate()) {
                    <bx-icon size="20" [name]="endIcon()" [contentTemplate]="endIconTemplate()" />
                }</ng-content
        ></span>
    </span>
</button>
