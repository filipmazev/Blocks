<button bxSurface [bxSurfaceEmission]="danger() ? 'var(--bx-text-danger)' : 'var(--bx-primary)'" type="button" role="menuitem" [disabled]="disabled()" class="bx-menu-item-btn" [class.is-disabled]="disabled()" [class.is-danger]="danger()"
    [class.bx-menu-item-animated]="isAnimated()" (click)="onClick($event)">

    @if (icon()) {
    <bx-icon class="bx-icon-pos-start" [name]="icon()!" size="20" />
    }

    <span class="bx-menu-item-content" [class.bx-menu-item-content-wrapped]="wrapLabel()">
        @if (resolvedLabel()) {
        {{ resolvedLabel() }}
        } @else {
        <ng-content></ng-content>
        }
    </span>

    @if (resolvedShortcut()) {
    <span class="bx-menu-item-shortcut">
        @for (key of resolvedShortcut(); track $index) {
        <kbd>{{ key }}</kbd>
        }
    </span>
    }

    @if (endIcon()) {
    <bx-icon class="bx-icon-pos-end" [name]="endIcon()!" size="20" />
    }
</button>
