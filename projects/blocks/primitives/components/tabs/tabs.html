<ng-content select="bx-tab"></ng-content>

<div bxSurface data-bx-surface="glass" class="bx-tab-header" role="tablist" aria-orientation="horizontal" [attr.aria-label]="resolvedLabel()">
    <div class="bx-tab-list">
        @for (tab of tabs(); track tab) {
            <button
                #trigger
                bxSurface
                data-bx-surface="glass"
                class="bx-tab-trigger"
                type="button"
                role="tab"
                [bxSurfaceEmission]="tab.resolvedEmission()"
                [style.--bx-tab-highlight]="tab.resolvedHighlight()"
                [style.--bx-tab-text]="tab.resolvedTextColor()"
                [style.--bx-tab-selected-text]="tab.resolvedSelectedText()"
                [id]="tab.triggerId"
                [attr.aria-controls]="tab.panelId"
                [attr.aria-selected]="tab === activeTab()"
                [attr.tabindex]="tab === activeTab() ? 0 : -1"
                [disabled]="tab.disabled()"
                [class.is-selected]="tab === activeTab()"
                (click)="select(tab.value())"
                (keydown)="onTabKey($event, tab)">
                @if (tab.icon()) {
                    <bx-icon size="16" [name]="tab.icon()!" />
                }
                <span>{{ tab.resolvedLabel() }}</span>
                @if (tab.endIcon()) {
                    <bx-icon size="16" [name]="tab.endIcon()!" />
                }
            </button>
        }
    </div>
</div>

<div class="bx-tab-panels">
    @for (tab of tabs(); track tab) {
        <div
            class="bx-tab-panel"
            role="tabpanel"
            tabindex="0"
            [id]="tab.panelId"
            [style.color]="tab.resolvedContentColor()"
            [attr.aria-labelledby]="tab.triggerId"
            [hidden]="tab !== activeTab()">
            @if (tab === activeTab()) {
                <ng-container [ngTemplateOutlet]="tab.template()"></ng-container>
            }
        </div>
    }
</div>
