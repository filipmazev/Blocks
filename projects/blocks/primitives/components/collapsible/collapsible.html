<div class="bx-collapsible" bxSurface [bxSurfaceInteractive]="false">
    <div role="heading" [attr.aria-level]="level()">
        <button
            type="button"
            class="bx-collapsible-trigger"
            data-bx-collapsible-trigger
            [id]="triggerId()"
            [disabled]="disabled()"
            [attr.aria-disabled]="isReadonly() ? 'true' : null"
            [attr.aria-expanded]="expanded()"
            [attr.aria-controls]="panelId()"
            (click)="toggle()">
            <span class="bx-collapsible-title">
                @if (titleTemplate(); as template) {
                    <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="titleContext()" />
                } @else {
                    {{ resolvedTitle() }}
                }
            </span>
            @if (trailingTemplate(); as template) {
                <span class="bx-collapsible-trailing">
                    <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="titleContext()" />
                </span>
            }
            <bx-icon size="20" [name]="expanded() ? 'chevron-up' : 'chevron-down'" />
        </button>
    </div>
    <div
        class="bx-collapsible-content"
        [id]="panelId()"
        [hidden]="!expanded()"
        [attr.inert]="expanded() ? null : ''"
        [attr.role]="region() ? 'region' : null"
        [attr.aria-labelledby]="region() ? triggerId() : null">
        <ng-content />
        @if (expanded() && contentTemplate(); as template) {
            <ng-container [ngTemplateOutlet]="template" />
        }
    </div>
</div>
