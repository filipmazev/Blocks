<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Blocks app icon</title>
  <desc>A large translucent glass pane catches the orange light of a floating orb.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#171717" />
      <stop offset="1" stop-color="#0B0B0B" />
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="45%" r="58%">
      <stop stop-color="#FF6900" stop-opacity=".105" />
      <stop offset=".56" stop-color="#FF6900" stop-opacity=".025" />
      <stop offset="1" stop-color="#FF6900" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paneGlass" x1="8%" y1="4%" x2="90%" y2="100%">
      <stop stop-color="#FFFFFF" stop-opacity=".2" />
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".075" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".035" />
    </linearGradient>
    <radialGradient id="paneLight" cx="73%" cy="28%" r="67%">
      <stop stop-color="#FF6900" stop-opacity=".4" />
      <stop offset=".3" stop-color="#FF6900" stop-opacity=".2" />
      <stop offset=".7" stop-color="#FF6900" stop-opacity=".055" />
      <stop offset="1" stop-color="#FF6900" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="paneRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop stop-color="#FFFFFF" stop-opacity=".82" />
      <stop offset=".25" stop-color="#FFFFFF" stop-opacity=".3" />
      <stop offset=".55" stop-color="#FF6900" stop-opacity=".52" />
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".18" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".58" />
    </linearGradient>
    <linearGradient id="paneHighlight" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop stop-color="#FFFFFF" stop-opacity=".78" />
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".2" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="reflection" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop stop-color="#FF6900" stop-opacity="0" />
      <stop offset=".4" stop-color="#FF6900" stop-opacity=".44" />
      <stop offset=".68" stop-color="#FFC08C" stop-opacity=".8" />
      <stop offset="1" stop-color="#FF6900" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="orbGlass" cx="31%" cy="25%" r="82%">
      <stop stop-color="#FFFFFF" stop-opacity=".54" />
      <stop offset=".28" stop-color="#FFFFFF" stop-opacity=".24" />
      <stop offset=".7" stop-color="#FFFFFF" stop-opacity=".075" />
      <stop offset="1" stop-color="#FF6900" stop-opacity=".16" />
    </radialGradient>
    <radialGradient id="orbCore" cx="42%" cy="40%" r="68%">
      <stop stop-color="#FFF3E5" stop-opacity=".96" />
      <stop offset=".18" stop-color="#FFB66F" stop-opacity=".9" />
      <stop offset=".48" stop-color="#FF6900" stop-opacity=".66" />
      <stop offset="1" stop-color="#FF6900" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbRim" x1="7%" y1="4%" x2="95%" y2="100%">
      <stop stop-color="#FFFFFF" stop-opacity=".94" />
      <stop offset=".3" stop-color="#FFFFFF" stop-opacity=".36" />
      <stop offset=".66" stop-color="#FF6900" stop-opacity=".56" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".82" />
    </linearGradient>
    <linearGradient id="orbRibbon" x1="0%" y1="10%" x2="100%" y2="80%">
      <stop stop-color="#FF6900" stop-opacity="0" />
      <stop offset=".34" stop-color="#FF9B4A" stop-opacity=".88" />
      <stop offset=".58" stop-color="#FFFFFF" stop-opacity=".98" />
      <stop offset=".84" stop-color="#FF6900" stop-opacity=".86" />
      <stop offset="1" stop-color="#FF6900" stop-opacity="0" />
    </linearGradient>
    <filter id="paneShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="lightBloom" x="-80%" y="-120%" width="260%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="orbBloom" x="-90%" y="-90%" width="280%" height="280%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="32" />
    </filter>
    <filter id="orbRibbonBloom" x="-30%" y="-90%" width="160%" height="280%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <clipPath id="paneClip" clipPathUnits="userSpaceOnUse">
      <rect x="184" y="220" width="656" height="624" rx="48" />
    </clipPath>
  </defs>

  <g id="background-layer">
    <path fill="url(#background)" d="M0 0h1024v1024H0z" />
    <path fill="url(#ambient)" d="M0 0h1024v1024H0z" />
  </g>

  <g id="pane-layer" transform="rotate(-6 512 532)">
    <rect x="184" y="220" width="656" height="624" rx="48" fill="#000000" fill-opacity=".48" filter="url(#paneShadow)" />
    <rect x="184" y="220" width="656" height="624" rx="48" fill="url(#paneGlass)" stroke="url(#paneRim)" stroke-width="3" />
    <g clip-path="url(#paneClip)">
      <rect x="184" y="220" width="656" height="624" fill="url(#paneLight)" />
      <path d="M513 444c35 17 89 18 136-4" stroke="#FF6900" stroke-opacity=".48" stroke-width="64" stroke-linecap="round" filter="url(#lightBloom)" />
      <path d="M513 444c35 17 89 18 136-4" stroke="url(#reflection)" stroke-width="13" stroke-linecap="round" />
      <path d="M521 438c34 15 81 14 122-6" stroke="#FFF4E9" stroke-opacity=".72" stroke-width="2.5" stroke-linecap="round" />
      <path d="M219 312c165-62 387-72 566-28" stroke="url(#paneHighlight)" stroke-width="2.5" />
      <path d="M231 325c147-53 338-63 488-34" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1.2" />
      <path d="M270 773c153 35 362 28 510-21" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="1.4" />
    </g>
    <rect x="191" y="227" width="642" height="610" rx="42" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="1.2" />
  </g>

  <g id="orb-layer">
    <circle cx="642" cy="317" r="152" fill="#FF6900" fill-opacity=".44" filter="url(#orbBloom)" />
    <circle cx="642" cy="317" r="119" fill="url(#orbGlass)" stroke="url(#orbRim)" stroke-width="3.5" />
    <circle cx="642" cy="317" r="108" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="1.2" />
    <ellipse cx="632" cy="325" rx="83" ry="75" fill="url(#orbCore)" />
    <path d="M557 333c24-48 59-71 91-54 27 15 42 50 78 34" stroke="#FF6900" stroke-opacity=".74" stroke-width="34" stroke-linecap="round" filter="url(#orbRibbonBloom)" />
    <path d="M557 333c24-48 59-71 91-54 27 15 42 50 78 34" stroke="url(#orbRibbon)" stroke-width="12" stroke-linecap="round" />
    <path d="M566 328c21-37 51-54 76-40 24 13 39 41 68 29" stroke="#FFFFFF" stroke-opacity=".86" stroke-width="2.4" stroke-linecap="round" />
    <path d="M570 268c18-22 45-35 72-38" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="5" stroke-linecap="round" />
    <path d="M575 275c13-13 28-22 43-27" stroke="#FFFFFF" stroke-opacity=".52" stroke-width="2" stroke-linecap="round" />
    <circle cx="592" cy="251" r="4.5" fill="#FFFFFF" fill-opacity=".86" />
  </g>
</svg>
